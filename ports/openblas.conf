# Port verification config for OpenBLAS 0.3.33 ZVL128B build
# See: https://github.com/clusterchallenge/Hardware-Abstraction-Layer-Transitional-Libraries/issues/25
#
# OpenBLAS uses hand-written RVV assembly for dgemm_kernel with vsetivli
# (immediate-VL variant) rather than the vsetvli (register-VL variant)
# that compiler auto-vec typically emits. The kernel is structured as a
# single function with internal labels (.L4, .L6, ...) for blocking and
# packing — function-scoped attribution doesn't apply, so we verify the
# whole object file.

PORT_NAME="openblas-dgemm"

BINARY="$HOME/openblas_findings/dgemm_kernel.o"

# Total RVV count locked. Issue #25 reported 75 with a slightly narrower
# regex; we measure ~98 here with the broader regex including vsetivli
# and load/store/reduction families.
MIN_TOTAL_RVV=91

# No function-scoped check for hand-asm kernels.
HOT_FUNCTION=""

# Canary: match both register-VL (vsetvli) and immediate-VL (vsetivli)
# variants. Hand-asm kernels usually use vsetivli with compile-time
# fixed VL — 7 such instructions are expected in this object.
BACKEND_CANARY='vsetvli|vsetivli'
