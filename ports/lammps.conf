# Port verification config for LAMMPS 30 Mar 2026 riscv64-rvv build
# See: https://github.com/clusterchallenge/Hardware-Abstraction-Layer-Transitional-Libraries/issues/30

PORT_NAME="lammps"

BINARY="$HOME/riscv-hpc-port/lammps-port/build-riscv64/lmp"

# Aggregate floor — issue #30 reports ~63,913 RVV opcodes (objdump+c++filt
# variant of disasm shows 64,750; the slight discrepancy is the c++filt-
# expanded line count, where one mangled function name may produce a
# slightly longer demangled line that grep ranges across the function
# entry).
MIN_TOTAL_RVV=10000

# Hot function attribution.
#
# Substring match across the PairLJCut::compute* family (including rRESPA
# variants compute_inner/middle/outer) shows 68 total RVV ops. Exact match
# on the canonical PairLJCut::compute(int, int) shows 24. These 24 are
# isolated SLP-vectorized fixed-size operations in the function epilogue
# (most likely the 6-element virial array accumulation and per-atom
# energy updates) — confirmed by disassembly showing contiguous vle64.v
# (NOT vluxei64.v indexed gather) in 5-8 instruction blocks separated by
# scalar code. The inner neighbor-list loop is scalar.
#
# Exact-count assertion (==24) so any future toolchain change that
# vectorizes the inner loop, or one that loses the epilogue SLP, fails
# this gate loudly and prompts revisitation.
HOT_FUNCTION="LAMMPS_NS::PairLJCut::compute(int, int)"
HOT_MATCH_MODE="exact"
EXPECTED_HOT_OPS="=24"

# Backend canary
BACKEND_CANARY='vsetvli'
