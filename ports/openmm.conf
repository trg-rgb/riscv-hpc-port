# Port verification config for OpenMM 8.5.0 riscv64-rvv build
# See: https://github.com/clusterchallenge/Hardware-Abstraction-Layer-Transitional-Libraries/issues/29

PORT_NAME="openmm-cpu"

# OpenMM's RVV-vectorized hot path is in the CPU platform plugin, not the
# core library. The core libOpenMM.so has 15,093 RVV ops (auto-vec across
# misc utility code); the CPU plugin libOpenMMCPU.so has 7,609 RVV ops
# concentrated in CpuNonbondedForce.
BINARY="$HOME/riscv-hpc-port/openmm-port/install-riscv64/usr/lib/plugins/libOpenMMCPU.so"

# Aggregate floor — independently verified at 7,609 in the CPU plugin.
# Floor set at 5,000 for headroom against compiler-version drift.
MIN_TOTAL_RVV=5000

# Hot function: canonical CpuNonbondedForceFvec<fvec4>::calculateBlockIxn.
# Exact match because the function dispatches to 4 template specializations
# (calculateBlockIxnImpl<2|3|4, BlockType>) which carry additional 1,179
# RVV ops collectively. The canonical function itself carries 861, which
# matches the figure originally reported in issue #29 (verified here via
# independent tooling).
#
# Substring match across the family would give 2,040 — also a true and
# defensible number, but a different claim than "the canonical function
# is vectorized." For this gate we lock the canonical count.
HOT_FUNCTION="OpenMM::CpuNonbondedForceFvec<fvec4>::calculateBlockIxn(int, float*, double*, fvec4 const&, fvec4 const&)"
HOT_MATCH_MODE="exact"
EXPECTED_HOT_OPS="=861"

# Backend canary
BACKEND_CANARY='vsetvli'
